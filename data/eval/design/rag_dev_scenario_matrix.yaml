scenarios:
  -
    scenario_id: "RAG-DEV-S001"
    name: "待发货退款的订单事实与资格前置"
    layer: "rag"
    capability: "条件化政策证据检索"
    scope_status: "in_scope"
    business_intent: "return_refund"
    scenario_type: "state_conditioned"
    difficulty: "medium"
    context_mode: "fact_enriched"
    category: "ambiguity"
    priority: "p1"
    preconditions:
      - "已支付且待发货；是否拣货/出库会影响取消路径，不能把状态名称等同退款资格。"
    input_mapping: "真实订单状态经 input_context.order_status 输入；支付确认及拣货细节如无独立字段，只能在原始输入说明。topic=refund_eligibility，related_topics 可含 cancel_policy。"
    rules_and_exceptions:
      - "必须确认资格后才进入申请"
      - "先查订单状态、支付状态和已有申请"
      - "已支付未出库可申请取消，但拣货后可能失败"
    ground_truth:
      status: "rule_located"
      primary_evidence_ref: "R02"
      other_required_evidence_refs:
        - "R01"
        - "R22"
      evidence_sufficiency: "当前文字规则可定位；不等于旧标签语义/系统性能已验证。"
    required_evidence_plan:
      -
        evidence_ref: "R02"
        evidence_type: "refund_eligibility"
        matching_content: "必须确认资格后才进入申请"
        scoring_condition: "绑定注册表source及section并匹配本义务具体文本；所有当前分支必需义务均须独立进入evidence_requirements。"
      -
        evidence_ref: "R01"
        evidence_type: "refund_application"
        matching_content: "先查订单状态、支付状态和已有申请"
        scoring_condition: "绑定注册表source及section并匹配本义务具体文本；所有当前分支必需义务均须独立进入evidence_requirements。"
      -
        evidence_ref: "R22"
        evidence_type: "order_cancel"
        matching_content: "已支付未出库可申请取消，但拣货后可能失败"
        scoring_condition: "绑定注册表source及section并匹配本义务具体文本；所有当前分支必需义务均须独立进入evidence_requirements。"
    distractor_evidence:
      -
        evidence_ref: "R21"
        inapplicable_reason: "待支付直接取消没有资金退款；已支付不适用。"
    existing_dev_case_ids:
      - "rag_refund_001"
    coverage: "weakly_covered"
    evidence_gap: "001 只有泛化的订单/状态/退款申请词；未控制仓库分支和资格证据。"
    variation_dimensions:
      business_conditions: "变化尚未拣货与已经拣货，保留已支付事实；只能检索取消可能性和退款前置规则，不能预言业务执行结果。"
      linguistic_variation: "可在业务条件固定后少量设计；不增加场景计数。"
