# RAG Dev 场景设计；evidence_ref 在本文件 evidence_registry 中解析。
design_version: "rag-dev-scope-2026-09-07"
artifact_kind: "scenario_design_not_executable_cases"
layer: "rag"
basis:
  - ".agents/skills/eval-dataset-builder/SKILL.md"
  - ".agents/skills/eval-dataset-builder/templates/scenario.yaml"
  - "data/README.md"
  - "data/dataset_sources.md"
  - "README.md"
  - "data/eval/rag_eval.jsonl"
  - "scripts/eval/eval_rag.py"
  - "app/rag/query_context.py"
  - "app/rag/query_builder.py"
  - "app/rag/ranking.py"
  - "app/agent/policies/evidence_guardrail.py"
scope:
  supported: "退款/退货政策检索及直接关联的订单取消、物流衔接、质量检测、风控人工审核、投诉资金边界；保留 V1 已有签收争议。范围从 V1 和评测入口推定，不代表已批准全业务扩展。"
  pending:
    - "签收争议是否长期保留为独立物流子域"
    - "会员影响退款资格、支付同步异常是否另批纳入"
    - "保修只作退款检测证据还是扩到完整维修/换新"
    - "退款MQ政策咨询是否持续作为Dev目标"
  excluded:
    - "完整物流时效与工单业务"
    - "独立支付/发票"
    - "独立会员权益"
    - "修改地址及商品型号数量"
    - "完整维修/换新/保修期限"
    - "独立投诉服务"
    - "退款工具执行、数据库/MQ副作用、Router准确率及最终回答质量"
  pending_not_counted_as_uncovered: true
dataset_roles:
  dev:
    path: "data/eval/rag_eval.jsonl"
    structure: "V1"
    rows: 20
    stored_split: "absent"
    actual_role: "dev"
  v2_reference:
    path: "data/eval/rag_eval_holdout.jsonl"
    structure: "rag-eval-v2"
    rows: 60
    stored_split: "holdout"
    actual_role: "validation"
    role_basis: "本轮用户明确指定；文件名和stored split保持不变。"
    usage: "本轮仅读取行数/schema_version/split元数据，未读取逐案例失败报告；不作为补题来源。"
counting:
  scenarios: 24
  covered: 8
  weakly_covered: 11
  uncovered: 5
  existing_case_rows: 20
  existing_rule_groups: 19
  business_rule_groups: 23
  additional_authority_diagnostic_groups: 1
  merged_case_ids:
    - "rag_refund_003"
    - "rag_refund_014"
  meaning: "覆盖描述输入与条件存在程度；不表示GT标签充分或系统通过。S023为跨既有业务规则的权威冲突诊断，不宣称新增业务能力。"
template_adaptation: "沿用场景、前置条件、ground_truth、expected_behavior概念；共享证据注册表消除重复。模板recommended_cases=3和linguistic_variation默认值不作为数量或场景依据。本文件不含query、expected或可执行JSONL案例。"
evaluator_contract:
  input: "raw query 与提供的上下文直接构建检索；不执行Router、订单查询或退款动作。事实真实性由数据准备审查保障。"
  effective_context: "primary_intent/topic/related_topics参与lexical/rerank和语义类别约束；order_status/shipping_status/product_name/product_category/signed_date参与三类查询；handoff_required增加人工处理文本。"
  inactive: "action_type仅传入和回写；tags不读取。scenario_type/difficulty/context_mode为分片标签，不改变单例评分。"
  v1: "expected_sources任一来源命中；expected_keywords全部子串可分散于TopK不同chunk，不绑定来源/section。另检查系统类别约束和guardrail。"
  v2: "primary_targets任一目标的首个排名用于Hit@K/MRR；所有必须命中的独立义务各进入evidence_requirements，不能仅放supporting_targets。每个requirement必须在同一chunk同时满足来源、section、词约束；不同requirement可不同chunk满足，不能要求互斥分支同时成立。"
  matching: "注册表的source+section绑定与每行matching_content一起构成检索断言设计；evidence_type仅诊断名称。落实时从该section提取准确短语，避免只用“不能/退款”等泛词，也避免把一个长段所有条件塞进单chunk。词匹配lower且去ASCII空格；来源精确匹配、section归一化相交。"
  capacity: "候选20、默认最终5；若多个义务需超过5个不同chunk，应按真实条件拆分场景子条件，不删必需证据凑通过。"
  limitations: "不能自动验证事实/蕴含/禁止答案/干扰源不出现/正式来源相对历史来源排名；匹配成功只说明检索代理指标满足。guardrail还检查首项score>=0.45、profile对应Top3来源和词命中，单例passed不是纯GT匹配。"
  execution: "本轮未运行检索或evaluator，不报告系统通过率。"
enum_mapping:
  category: "设计标签，沿用模板，不是可执行scenario_type。"
  mq_idempotency: "scenario_type=single_policy；evidence_type=refund_idempotency；不新增mq枚举。"
  unknown_refund_result: "scenario_type=insufficient_information；evidence_type=refund_idempotency/human_review。"
  negation: "scenario_type=semantic_confusion；没有负向证据排除的可执行字段。"
  authority: "scenario_type=authority_conflict；evidence_type按退款资格等业务内容，未新增authority枚举。"
