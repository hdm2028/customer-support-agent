name: Isolated release checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m scripts.maintenance.check_release --output reports/ci_release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check-results
          path: reports/ci_release
          retention-days: 14
