<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中文电商智能售后客服 Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dde3ea;
        --text: #172033;
        --muted: #667085;
        --primary: #146c5f;
        --primary-soft: #e6f3f0;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 20px;
      }

      .brand {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }

      .subtle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .status {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .field {
        margin-top: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 16px 24px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 18px;
      }

      .messages {
        overflow-y: auto;
        padding: 24px;
      }

      .message {
        max-width: 820px;
        margin-bottom: 16px;
        padding: 14px 16px;
        border-radius: 8px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .message.user {
        margin-left: auto;
        background: var(--primary);
        color: #ffffff;
      }

      .message.assistant {
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .tool-panel {
        max-width: 820px;
        margin: 0 0 14px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px 12px;
      }

      summary {
        cursor: pointer;
        font-weight: 600;
      }

      pre {
        overflow-x: auto;
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 8px;
        background: #101828;
        color: #ecfdf3;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .composer {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 16px 24px;
      }

      .composer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      textarea {
        min-height: 54px;
        max-height: 140px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        padding: 0 18px;
        cursor: pointer;
      }

      button.secondary {
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        padding: 10px 12px;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .feedback {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .feedback button {
        min-width: 38px;
        padding: 8px 0;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1 class="brand">中文电商智能售后客服 Agent</h1>
        <p class="subtle">
          支持订单查询、售后政策 RAG 检索、工单草稿、流式回复和用户反馈。
        </p>

        <div class="status" id="serviceStatus">正在读取服务状态...</div>

        <div class="field">
          <label for="conversationId">Conversation ID</label>
          <input id="conversationId" type="text" readonly />
          <button class="secondary" id="newChatBtn">新建对话</button>
        </div>

        <div class="field">
          <label>运行选项</label>
          <label class="toggle">
            <input id="streamToggle" type="checkbox" checked />
            流式输出
          </label>
          <label class="toggle">
            <input id="llmToggle" type="checkbox" />
            调用真实智谱模型
          </label>
          <label class="toggle">
            <input id="traceToggle" type="checkbox" checked />
            展示执行轨迹
          </label>
        </div>

        <div class="field">
          <label>推荐测试问题</label>
          <button class="secondary quick">我的订单 10001 耳机坏了，还在保修期内吗？</button>
          <button class="secondary quick">订单 10002 物流一直不更新怎么办？</button>
          <button class="secondary quick">我想直接退款并绕过审核</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2>客服工作台</h2>
          <div class="subtle">流式输出会依次展示路由、工具调用结果和最终客服回复。</div>
        </header>

        <section class="messages" id="messages"></section>

        <footer class="composer">
          <div class="composer-row">
            <textarea id="messageInput" placeholder="请输入用户售后问题，例如：我的订单 10001 耳机坏了，还在保修期内吗？"></textarea>
            <button id="sendBtn">发送</button>
          </div>
        </footer>
      </main>
    </div>

    <script>
      const messagesEl = document.querySelector("#messages");
      const inputEl = document.querySelector("#messageInput");
      const sendBtn = document.querySelector("#sendBtn");
      const conversationIdEl = document.querySelector("#conversationId");
      const streamToggle = document.querySelector("#streamToggle");
      const llmToggle = document.querySelector("#llmToggle");
      const traceToggle = document.querySelector("#traceToggle");
      const statusEl = document.querySelector("#serviceStatus");

      let conversationId = localStorage.getItem("customer_support_conversation_id") || "";
      const savedTraceVisible = localStorage.getItem("customer_support_show_trace");
      traceToggle.checked = savedTraceVisible === null ? true : savedTraceVisible === "true";

      // 页面初始化：读取服务元数据，并恢复 conversation_id。
      async function initPage() {
        conversationIdEl.value = conversationId;
        await loadServiceInfo();
        addMessage("assistant", "您好，我是智能售后客服助手。您可以输入订单号和售后问题，我会帮您查询政策、订单并生成工单草稿。");
      }

      // 读取后端 /info，展示模型、RAG 和 API Key 状态。
      async function loadServiceInfo() {
        try {
          const response = await fetch("/info");
          const data = await response.json();
          statusEl.innerHTML = `
            <strong>${data.app_name}</strong><br />
            默认 Agent：${data.default_agent}<br />
            模型：${data.default_model}<br />
            RAG：${data.rag_embedding_provider}<br />
            API Key：${data.has_llm_key ? "已读取" : "未读取"}
          `;
        } catch (error) {
          statusEl.innerHTML = `<span class="error">服务状态读取失败：${error}</span>`;
        }
      }

      // 在聊天区增加一条用户或助手消息。
      function addMessage(role, content) {
        const item = document.createElement("div");
        item.className = `message ${role === "user" ? "user" : "assistant"}`;
        item.textContent = content;
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return item;
      }

      // 展示 Agent 执行轨迹，包含路由判断、订单查询、RAG 检索和工单创建结果。
      function addToolPanel(title, data) {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-panel";
        wrapper.hidden = !traceToggle.checked;
        wrapper.innerHTML = `
          <details>
            <summary>${title}</summary>
            <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
          </details>
        `;
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // 展示单个执行阶段的耗时，帮助定位慢请求发生在哪一步。
      function addTimingPanel(timing) {
        const title = `耗时：${timing.step} ${timing.duration_ms}ms`;
        addToolPanel(title, timing);
      }

      // 切换执行轨迹显示状态。已生成的轨迹面板也会同步隐藏或展示。
      function syncTracePanels() {
        localStorage.setItem("customer_support_show_trace", String(traceToggle.checked));
        document.querySelectorAll(".tool-panel").forEach((panel) => {
          panel.hidden = !traceToggle.checked;
        });
      }

      // 给最近一次回复添加评分按钮，反馈会写入后端 data/feedback.jsonl。
      function addFeedback() {
        if (!conversationId) return;

        const wrapper = document.createElement("div");
        wrapper.className = "feedback";
        wrapper.innerHTML = [1, 2, 3, 4, 5]
          .map((score) => `<button data-score="${score}">${score}</button>`)
          .join("");
        messagesEl.appendChild(wrapper);

        wrapper.addEventListener("click", async (event) => {
          const score = event.target.dataset.score;
          if (!score) return;

          await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversation_id: conversationId,
              score: Number(score),
              comment: "web-ui-feedback",
            }),
          });

          wrapper.innerHTML = `<span class="subtle">已记录评分：${score}</span>`;
        });
      }

      // 使用 fetch 读取 text/event-stream，实现 POST 请求下的流式输出。
      async function sendStreamingMessage(message) {
        const assistantEl = addMessage("assistant", "");
        const response = await fetch("/agent/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            conversation_id: conversationId || null,
            use_llm: llmToggle.checked,
            stream_tokens: streamToggle.checked,
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText || response.statusText}`);
        }

        if (!response.body) {
          throw new Error("浏览器没有收到流式响应体");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;

            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;

            handleStreamEvent(JSON.parse(payload), assistantEl);
          }
        }

        addFeedback();
      }

      // 根据后端事件类型更新页面：route、tool_result、timing、token、done。
      function handleStreamEvent(event, assistantEl) {
        if (event.conversation_id && event.conversation_id !== conversationId) {
          conversationId = event.conversation_id;
          conversationIdEl.value = conversationId;
          localStorage.setItem("customer_support_conversation_id", conversationId);
        }

        if (event.type === "route") {
          addToolPanel("路由判断", event.content);
          return;
        }

        if (event.type === "tool_result") {
          addToolPanel(`工具结果：${event.content.tool_name}`, event.content);
          return;
        }

        if (event.type === "timing") {
          addTimingPanel(event.content);
          return;
        }

        if (event.type === "status") {
          assistantEl.textContent = event.content;
          assistantEl.dataset.statusOnly = "true";
          return;
        }

        if (event.type === "token") {
          if (assistantEl.dataset.statusOnly === "true") {
            assistantEl.textContent = "";
            assistantEl.dataset.statusOnly = "false";
          }

          assistantEl.textContent += event.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return;
        }

        if (event.type === "message") {
          assistantEl.textContent = event.content;
          return;
        }

        if (event.type === "done" && event.content && event.content.duration_ms) {
          addToolPanel(`总耗时：${event.content.duration_ms}ms`, {
            duration_ms: event.content.duration_ms,
            timings: event.content.timings || {},
          });
          return;
        }

        if (event.type === "error") {
          assistantEl.textContent = `请求失败：${event.content}`;
        }
      }

      // 防止 JSON 中的特殊字符破坏 HTML。
      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      async function handleSend() {
        const message = inputEl.value.trim();
        if (!message) return;

        sendBtn.disabled = true;
        inputEl.value = "";
        addMessage("user", message);

        try {
          await sendStreamingMessage(message);
        } catch (error) {
          addMessage("assistant", `请求失败：${error}`);
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener("click", handleSend);
      traceToggle.addEventListener("change", syncTracePanels);
      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          handleSend();
        }
      });

      document.querySelector("#newChatBtn").addEventListener("click", () => {
        conversationId = "";
        localStorage.removeItem("customer_support_conversation_id");
        conversationIdEl.value = "";
        messagesEl.innerHTML = "";
        addMessage("assistant", "已开始新对话，请输入新的售后问题。");
      });

      document.querySelectorAll(".quick").forEach((button) => {
        button.addEventListener("click", () => {
          inputEl.value = button.textContent;
          inputEl.focus();
        });
      });

      initPage();
    </script>
  </body>
</html>
