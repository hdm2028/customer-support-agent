<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中文电商智能售后客服 Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dde3ea;
        --text: #172033;
        --muted: #667085;
        --primary: #146c5f;
        --primary-soft: #e6f3f0;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 20px;
      }

      .brand {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }

      .subtle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .status {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .field {
        margin-top: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }

      .topbar {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 16px 24px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 18px;
      }

      .messages {
        overflow-y: auto;
        padding: 24px;
      }

      .message {
        max-width: 820px;
        margin-bottom: 16px;
        padding: 14px 16px;
        border-radius: 8px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .message.user {
        margin-left: auto;
        background: var(--primary);
        color: #ffffff;
      }

      .message.assistant {
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .tool-panel {
        max-width: 820px;
        margin: 0 0 14px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px 12px;
      }

      summary {
        cursor: pointer;
        font-weight: 600;
      }

      .trace-summary {
        margin-top: 10px;
        color: var(--text);
        font-size: 14px;
        line-height: 1.7;
      }

      .trace-summary ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      .trace-summary li {
        margin-top: 4px;
      }

      .trace-badge {
        display: inline-flex;
        align-items: center;
        margin: 3px 6px 3px 0;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
      }

      pre {
        overflow-x: auto;
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 8px;
        background: #101828;
        color: #ecfdf3;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .composer {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 16px 24px;
      }

      .composer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      textarea {
        min-height: 54px;
        max-height: 140px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        padding: 0 18px;
        cursor: pointer;
      }

      button.secondary {
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        padding: 10px 12px;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .feedback {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .feedback button {
        min-width: 38px;
        padding: 8px 0;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .error {
        color: var(--danger);
      }

      .latency-summary {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        font-size: 13px;
      }

      .latency-summary strong {
        display: block;
        margin-bottom: 8px;
      }

      .latency-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 6px;
        color: var(--muted);
      }

      .latency-row span:last-child {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1 class="brand">中文电商智能售后客服 Agent</h1>
        <p class="subtle">
          支持订单查询、售后政策 RAG 检索、工单草稿、流式回复和用户反馈。
        </p>

        <div class="status" id="serviceStatus">正在读取服务状态...</div>
        <div class="latency-summary" id="latencySummary">
          <strong>性能耗时</strong>
          <div class="subtle">发送问题后显示每一步耗时。</div>
        </div>

        <div class="field">
          <label for="conversationId">Conversation ID</label>
          <input id="conversationId" type="text" readonly />
          <button class="secondary" id="newChatBtn">新建对话</button>
        </div>

        <div class="field">
          <label>运行选项</label>
          <label class="toggle">
            <input id="streamToggle" type="checkbox" checked />
            流式输出
          </label>
          <label class="toggle">
            <input id="llmToggle" type="checkbox" />
            调用真实智谱模型
          </label>
          <label class="toggle">
            <input id="traceToggle" type="checkbox" checked />
            展示执行轨迹
          </label>
        </div>

        <div class="field">
          <label>推荐测试问题</label>
          <button class="secondary quick">我的订单 10001 耳机坏了，还在保修期内吗？</button>
          <button class="secondary quick">订单 10002 物流一直不更新怎么办？</button>
          <button class="secondary quick">我想直接退款并绕过审核</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2>客服工作台</h2>
          <div class="subtle">流式输出会依次展示路由、工具调用结果和最终客服回复。</div>
        </header>

        <section class="messages" id="messages"></section>

        <footer class="composer">
          <div class="composer-row">
            <textarea id="messageInput" placeholder="请输入用户售后问题，例如：我的订单 10001 耳机坏了，还在保修期内吗？"></textarea>
            <button id="sendBtn">发送</button>
          </div>
        </footer>
      </main>
    </div>

    <script>
      const messagesEl = document.querySelector("#messages");
      const inputEl = document.querySelector("#messageInput");
      const sendBtn = document.querySelector("#sendBtn");
      const conversationIdEl = document.querySelector("#conversationId");
      const streamToggle = document.querySelector("#streamToggle");
      const llmToggle = document.querySelector("#llmToggle");
      const traceToggle = document.querySelector("#traceToggle");
      const statusEl = document.querySelector("#serviceStatus");
      const latencySummaryEl = document.querySelector("#latencySummary");

      let conversationId = localStorage.getItem("customer_support_conversation_id") || "";
      let currentTimings = {};
      let currentDurationMs = null;
      const savedTraceVisible = localStorage.getItem("customer_support_show_trace");
      traceToggle.checked = savedTraceVisible === null ? true : savedTraceVisible === "true";

      // 页面初始化：读取服务元数据，并恢复 conversation_id。
      async function initPage() {
        conversationIdEl.value = conversationId;
        await loadServiceInfo();
        addMessage("assistant", "您好，我是智能售后客服助手。您可以输入订单号和售后问题，我会帮您查询政策、订单并生成工单草稿。");
      }

      // 读取后端 /info，展示模型、RAG 和 API Key 状态。
      async function loadServiceInfo() {
        try {
          const response = await fetch("/info");
          const data = await response.json();
          statusEl.innerHTML = `
            <strong>${data.app_name}</strong><br />
            默认 Agent：${data.default_agent}<br />
            模型：${data.default_model}<br />
            RAG：${data.rag_embedding_provider}<br />
            API Key：${data.has_llm_key ? "已读取" : "未读取"}
          `;
        } catch (error) {
          statusEl.innerHTML = `<span class="error">服务状态读取失败：${error}</span>`;
        }
      }

      // 在聊天区增加一条用户或助手消息。
      function addMessage(role, content) {
        const item = document.createElement("div");
        item.className = `message ${role === "user" ? "user" : "assistant"}`;
        item.textContent = content;
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return item;
      }

      // 展示 Agent 执行轨迹：先给业务摘要，再保留原始 JSON 方便调试。
      function addToolPanel(title, data, summaryHtml = "") {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-panel";
        wrapper.hidden = !traceToggle.checked;
        wrapper.innerHTML = `
          <details>
            <summary>${title}</summary>
            ${summaryHtml ? `<div class="trace-summary">${summaryHtml}</div>` : ""}
            <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
          </details>
        `;
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function yesNo(value) {
        return value ? "是" : "否";
      }

      function badge(text) {
        return `<span class="trace-badge">${escapeHtml(text)}</span>`;
      }

      function buildRouteSummary(route) {
        const actions = [];

        if (route.need_order) actions.push("订单查询");
        if (route.need_policy) actions.push("政策检索");
        if (route.need_ticket) actions.push("创建工单");
        if (route.need_clarification) actions.push("追问信息");
        if (route.handoff_required) actions.push("人工审核");
        if (route.blocked_by_guardrail) actions.push("安全拦截");

        return `
          <div>Agent 已完成意图路由，给出本轮问题的初步工具计划：</div>
          <ul>
            <li>订单号：${escapeHtml(route.order_id || "未提供")}</li>
            <li>风险等级：${escapeHtml(route.risk_level || "low")}</li>
            <li>计划订单查询：${yesNo(route.need_order)}</li>
            <li>计划政策检索：${yesNo(route.need_policy)}</li>
            <li>计划创建工单：${yesNo(route.need_ticket)}</li>
            <li>需要追问用户：${yesNo(route.need_clarification)}</li>
            <li>需要人工审核：${yesNo(route.handoff_required)}</li>
          </ul>
          <div>${actions.length ? actions.map(badge).join("") : badge("普通回复")}</div>
          ${route.clarification_question ? `<div>追问内容：${escapeHtml(route.clarification_question)}</div>` : ""}
          ${route.handoff_reason ? `<div>人工审核原因：${escapeHtml(route.handoff_reason)}</div>` : ""}
          ${route.guardrail_reason ? `<div>安全拦截原因：${escapeHtml(route.guardrail_reason)}</div>` : ""}
        `;
      }

      function buildExecutionBlockedSummary(event) {
        return `
          <div>执行链已被业务规则拦截，后续工具不会继续调用。</div>
          <ul>
            <li>拦截原因：${escapeHtml(event.reason || "未知")}</li>
            <li>订单号：${escapeHtml(event.order_id || "未提供")}</li>
            <li>处理说明：${escapeHtml(event.message || "已停止后续业务动作")}</li>
          </ul>
        `;
      }

      function buildOrderSummary(result) {
        if (!result.success) {
          return `<div>订单查询失败：${escapeHtml(String(result.result))}</div>`;
        }

        const order = result.result || {};
        return `
          <div>已查询到订单信息，后续回复会基于这些订单字段判断售后方案。</div>
          <ul>
            <li>订单号：${escapeHtml(order.order_id || "未知")}</li>
            <li>商品：${escapeHtml(order.product_name || "未知")}</li>
            <li>订单状态：${escapeHtml(order.order_status || "未知")}</li>
            <li>物流状态：${escapeHtml(order.shipping_status || "未知")}</li>
            <li>签收日期：${escapeHtml(order.signed_date || "未签收")}</li>
            <li>是否可直接退款：${yesNo(order.can_refund_directly)}</li>
          </ul>
          ${order.notes ? `<div>订单备注：${escapeHtml(order.notes)}</div>` : ""}
        `;
      }

      function buildPolicySummary(result) {
        if (!result.success) {
          return `<div>政策检索失败：${escapeHtml(String(result.result))}</div>`;
        }

        const policies = Array.isArray(result.result) ? result.result : [];
        const rows = policies
          .slice(0, 3)
          .map((item, index) => `
            <li>
              证据 ${index + 1}：
              ${escapeHtml(item.citation || item.source || "未知来源")}
              ${item.rerank_score === undefined ? "" : `，重排分数：${escapeHtml(String(item.rerank_score))}`}
              ${item.retrieval_score === undefined ? "" : `，初召回分数：${escapeHtml(String(item.retrieval_score))}`}
              ${Array.isArray(item.rerank_reasons) && item.rerank_reasons.length ? `，原因：${escapeHtml(item.rerank_reasons.slice(0, 2).join("；"))}` : ""}
            </li>
          `)
          .join("");

        return `
          <div>RAG 从售后知识库中命中 ${policies.length} 条政策证据，模型回答时应引用这些来源。</div>
          <ul>${rows || "<li>没有可展示的政策证据。</li>"}</ul>
        `;
      }

      function buildTicketSummary(result) {
        if (!result.success) {
          return `<div>工单创建失败：${escapeHtml(String(result.result))}</div>`;
        }

        const ticket = result.result || {};
        return `
          <div>系统已生成待人工审核的工单草稿，不会直接修改订单或执行退款。</div>
          <ul>
            <li>工单号：${escapeHtml(ticket.ticket_id || "未返回")}</li>
            <li>工单状态：${escapeHtml(ticket.status || "未知")}</li>
            <li>关联订单：${escapeHtml(ticket.order_id || "未知")}</li>
            <li>问题类型：${escapeHtml(ticket.issue_type || "未知")}</li>
            <li>优先级：${escapeHtml(ticket.priority || "normal")}</li>
            <li>下一步：${escapeHtml(ticket.next_step || "等待人工客服处理")}</li>
          </ul>
          ${ticket.risk_notice ? `<div>风险提示：${escapeHtml(ticket.risk_notice)}</div>` : ""}
        `;
      }

      function buildTicketDecisionSummary(result) {
        const decision = result.result || {};
        return `
          <div>系统已完成工单创建前的业务资格判断。</div>
          <ul>
            <li>是否创建工单：${yesNo(decision.can_create)}</li>
            <li>原因：${escapeHtml(decision.reason || "未返回原因")}</li>
            <li>建议优先级：${escapeHtml(decision.priority || "normal")}</li>
          </ul>
        `;
      }

      function buildToolSummary(toolResult) {
        if (toolResult.tool_name === "order_lookup") {
          return buildOrderSummary(toolResult);
        }

        if (toolResult.tool_name === "policy_search") {
          return buildPolicySummary(toolResult);
        }

        if (toolResult.tool_name === "create_ticket") {
          return buildTicketSummary(toolResult);
        }

        if (toolResult.tool_name === "ticket_decision") {
          return buildTicketDecisionSummary(toolResult);
        }

        return "<div>工具执行完成，详细结果见下方 JSON。</div>";
      }

      // 把技术性的 step 名称翻译成页面上更容易读懂的中文。
      function formatTimingStep(step) {
        const names = {
          "node.load_context": "加载上下文",
          "node.route": "路由判断",
          "node.execute_tools": "工具执行汇总",
          "node.build_model_context": "构造模型上下文",
          "node.generate_reply": "生成回复",
          "node.persist_result": "保存结果",
          "tool.order_lookup": "订单查询",
          "tool.policy_search": "政策检索",
          "tool.create_ticket": "创建工单",
        };
        return names[step] || step;
      }

      // 更新左侧性能摘要，让耗时不再只藏在折叠面板中。
      function renderLatencySummary() {
        const timings = Object.values(currentTimings);

        if (!timings.length && currentDurationMs === null) {
          latencySummaryEl.innerHTML = `
            <strong>性能耗时</strong>
            <div class="subtle">发送问题后显示每一步耗时。</div>
          `;
          return;
        }

        const rows = timings
          .map((timing) => `
            <div class="latency-row">
              <span>${formatTimingStep(timing.step)}</span>
              <span>${timing.duration_ms}ms</span>
            </div>
          `)
          .join("");

        latencySummaryEl.innerHTML = `
          <strong>性能耗时</strong>
          ${currentDurationMs === null ? "" : `
            <div class="latency-row">
              <span>总耗时</span>
              <span>${currentDurationMs}ms</span>
            </div>
          `}
          ${rows}
        `;
      }

      function resetLatencySummary() {
        currentTimings = {};
        currentDurationMs = null;
        renderLatencySummary();
      }

      // 切换执行轨迹显示状态。已生成的轨迹面板也会同步隐藏或展示。
      function syncTracePanels() {
        localStorage.setItem("customer_support_show_trace", String(traceToggle.checked));
        document.querySelectorAll(".tool-panel").forEach((panel) => {
          panel.hidden = !traceToggle.checked;
        });
      }

      // 给最近一次回复添加评分按钮，反馈会写入后端 data/feedback.jsonl。
      function addFeedback() {
        if (!conversationId) return;

        const wrapper = document.createElement("div");
        wrapper.className = "feedback";
        wrapper.innerHTML = [1, 2, 3, 4, 5]
          .map((score) => `<button data-score="${score}">${score}</button>`)
          .join("");
        messagesEl.appendChild(wrapper);

        wrapper.addEventListener("click", async (event) => {
          const score = event.target.dataset.score;
          if (!score) return;

          await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversation_id: conversationId,
              score: Number(score),
              comment: "web-ui-feedback",
            }),
          });

          wrapper.innerHTML = `<span class="subtle">已记录评分：${score}</span>`;
        });
      }

      // 使用 fetch 读取 text/event-stream，实现 POST 请求下的流式输出。
      async function sendStreamingMessage(message) {
        const assistantEl = addMessage("assistant", "");
        const response = await fetch("/agent/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            conversation_id: conversationId || null,
            use_llm: llmToggle.checked,
            stream_tokens: streamToggle.checked,
          }),
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText || response.statusText}`);
        }

        if (!response.body) {
          throw new Error("浏览器没有收到流式响应体");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;

            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;

            handleStreamEvent(JSON.parse(payload), assistantEl);
          }
        }

        addFeedback();
      }

      // 根据后端事件类型更新页面：route、tool_result、execution_blocked、timing、token、done。
      function handleStreamEvent(event, assistantEl) {
        if (event.conversation_id && event.conversation_id !== conversationId) {
          conversationId = event.conversation_id;
          conversationIdEl.value = conversationId;
          localStorage.setItem("customer_support_conversation_id", conversationId);
        }

        if (event.type === "route") {
          addToolPanel("路由判断", event.content, buildRouteSummary(event.content));
          return;
        }

        if (event.type === "tool_result") {
          addToolPanel(
            `工具结果：${event.content.tool_name}`,
            event.content,
            buildToolSummary(event.content),
          );
          return;
        }

        if (event.type === "execution_blocked") {
          addToolPanel(
            "执行拦截",
            event.content,
            buildExecutionBlockedSummary(event.content),
          );
          return;
        }

        if (event.type === "timing") {
          currentTimings[event.content.step] = event.content;
          renderLatencySummary();
          return;
        }

        if (event.type === "status") {
          assistantEl.textContent = event.content;
          assistantEl.dataset.statusOnly = "true";
          return;
        }

        if (event.type === "token") {
          if (assistantEl.dataset.statusOnly === "true") {
            assistantEl.textContent = "";
            assistantEl.dataset.statusOnly = "false";
          }

          assistantEl.textContent += event.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return;
        }

        if (event.type === "message") {
          assistantEl.textContent = event.content;
          return;
        }

        if (event.type === "done" && event.content && event.content.duration_ms) {
          currentDurationMs = event.content.duration_ms;
          currentTimings = event.content.timings || currentTimings;
          renderLatencySummary();
          return;
        }

        if (event.type === "error") {
          assistantEl.textContent = `请求失败：${event.content}`;
        }
      }

      // 防止 JSON 中的特殊字符破坏 HTML。
      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      async function handleSend() {
        const message = inputEl.value.trim();
        if (!message) return;

        sendBtn.disabled = true;
        inputEl.value = "";
        resetLatencySummary();
        addMessage("user", message);

        try {
          await sendStreamingMessage(message);
        } catch (error) {
          addMessage("assistant", `请求失败：${error}`);
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener("click", handleSend);
      traceToggle.addEventListener("change", syncTracePanels);
      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          handleSend();
        }
      });

      document.querySelector("#newChatBtn").addEventListener("click", () => {
        conversationId = "";
        localStorage.removeItem("customer_support_conversation_id");
        conversationIdEl.value = "";
        messagesEl.innerHTML = "";
        resetLatencySummary();
        addMessage("assistant", "已开始新对话，请输入新的售后问题。");
      });

      document.querySelectorAll(".quick").forEach((button) => {
        button.addEventListener("click", () => {
          inputEl.value = button.textContent;
          inputEl.focus();
        });
      });

      initPage();
    </script>
  </body>
</html>
