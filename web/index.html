<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能售后 Agent 控制台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fa;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --line: #d8e1ea;
        --line-strong: #b7c6d6;
        --text: #0f172a;
        --muted: #64748b;
        --teal: #257366;
        --teal-soft: #e3f3ef;
        --amber: #b7791f;
        --amber-soft: #fff7e6;
        --red: #b42318;
        --red-soft: #fff1f0;
        --blue: #2563a9;
        --blue-soft: #eaf2ff;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Hiragino Sans GB",
          Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        min-height: 720px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 14px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .title-wrap h1 {
        margin: 0 0 4px;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .title-wrap p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
        color: var(--text);
        font-size: 13px;
        white-space: nowrap;
      }

      .toggle input {
        width: 14px;
        height: 14px;
        accent-color: var(--teal);
      }

      .btn {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
      }

      .btn.primary {
        border-color: var(--teal);
        background: var(--teal);
        color: #fff;
        font-weight: 700;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(420px, 1fr) 330px;
        min-height: 0;
      }

      .sidebar,
      .inspector {
        min-height: 0;
        overflow: auto;
        background: #f9fbfd;
        border-right: 1px solid var(--line);
        padding: 14px;
      }

      .inspector {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 1px 0 rgba(15, 23, 42, 0.03);
        margin-bottom: 12px;
        overflow: hidden;
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        font-weight: 800;
      }

      .panel-body {
        padding: 12px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .status-item,
      .metric-row,
      .data-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 30px;
        color: var(--muted);
        font-size: 12px;
      }

      .status-item strong,
      .metric-row strong,
      .data-row strong {
        color: var(--text);
        font-weight: 800;
        text-align: right;
        max-width: 150px;
        overflow-wrap: anywhere;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        white-space: nowrap;
      }

      .pill.ok {
        border-color: #b7dfd2;
        background: var(--teal-soft);
        color: var(--teal);
      }

      .pill.warn {
        border-color: #f2d49b;
        background: var(--amber-soft);
        color: var(--amber);
      }

      .pill.danger {
        border-color: #f4b4ae;
        background: var(--red-soft);
        color: var(--red);
      }

      .architecture {
        display: grid;
        gap: 8px;
      }

      .arch-node {
        display: grid;
        grid-template-columns: 8px 1fr;
        gap: 8px;
        align-items: center;
        min-height: 32px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      .arch-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--line-strong);
      }

      .arch-node.active .arch-dot {
        background: var(--teal);
      }

      .arch-name {
        font-size: 13px;
        font-weight: 800;
      }

      .arch-sub {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .preset-list {
        display: grid;
        gap: 8px;
      }

      .preset {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        text-align: left;
        line-height: 1.35;
      }

      .preset:hover {
        border-color: var(--teal);
        background: var(--teal-soft);
      }

      .workspace {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        min-height: 0;
      }

      .agent-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .agent-card {
        min-height: 70px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .agent-card.active {
        border-color: var(--teal);
        background: var(--teal-soft);
      }

      .agent-role {
        color: var(--muted);
        font-size: 12px;
      }

      .agent-name {
        margin-top: 4px;
        font-size: 15px;
        font-weight: 900;
      }

      .agent-tools {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chat-panel {
        display: grid;
        grid-template-rows: 1fr;
        min-height: 0;
        background: var(--bg);
      }

      .messages {
        min-height: 0;
        overflow: auto;
        padding: 18px 24px 24px;
      }

      .empty-state {
        max-width: 680px;
        margin: 90px auto 0;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .empty-state h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      .empty-state p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .message {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      .message.user {
        justify-items: end;
      }

      .message.agent {
        justify-items: start;
      }

      .speaker {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .bubble {
        max-width: min(780px, 92%);
        padding: 14px 16px;
        border-radius: 8px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--line);
      }

      .user .bubble {
        border-color: var(--teal);
        background: var(--teal);
        color: #fff;
        font-weight: 700;
      }

      .agent .bubble {
        background: #fff;
      }

      .rating {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .rating button {
        width: 30px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--teal);
        font-weight: 800;
      }

      .rating button:hover {
        background: var(--teal-soft);
      }

      .tool-list,
      .timing-list,
      .object-list {
        display: grid;
        gap: 8px;
      }

      .tool-item {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      .tool-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .tool-name {
        font-weight: 900;
        font-size: 13px;
      }

      .tool-summary {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .trace {
        display: grid;
        gap: 6px;
      }

      .trace-item {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 8px;
        align-items: center;
        min-height: 28px;
        font-size: 12px;
      }

      .trace-step {
        color: var(--muted);
      }

      .trace-value {
        height: 8px;
        border-radius: 999px;
        background: var(--blue-soft);
        overflow: hidden;
      }

      .trace-bar {
        height: 100%;
        min-width: 3px;
        background: var(--blue);
      }

      .input-bar {
        display: grid;
        grid-template-columns: 1fr 84px;
        gap: 10px;
        align-items: end;
        padding: 12px 18px;
        background: var(--panel);
        border-top: 1px solid var(--line);
      }

      textarea {
        width: 100%;
        min-height: 54px;
        max-height: 160px;
        resize: vertical;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 13px 14px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      textarea:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(37, 115, 102, 0.12);
      }

      .send-btn {
        height: 54px;
      }

      .soft-note {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .mono {
        font-family: Consolas, "Courier New", monospace;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 1180px) {
        .layout {
          grid-template-columns: 250px minmax(360px, 1fr);
        }

        .inspector {
          display: none;
        }
      }

      @media (max-width: 820px) {
        .app {
          min-height: 100vh;
        }

        .topbar,
        .layout,
        .agent-strip,
        .input-bar {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .messages {
          padding: 14px;
        }

        .bubble {
          max-width: 100%;
        }

        .send-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-wrap">
          <h1>智能售后 Agent 控制台</h1>
          <p id="subtitle">Agent Orchestrator · Hybrid RAG · MySQL · Redis · MQ</p>
        </div>
        <div class="top-actions">
          <label class="toggle"><input id="streamToggle" type="checkbox" checked />流式</label>
          <label class="toggle"><input id="traceToggle" type="checkbox" checked />轨迹</label>
          <label class="toggle"><input id="llmToggle" type="checkbox" />LLM</label>
          <button class="btn" id="newChatBtn" type="button">新建</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-title">
              <span>组件状态</span>
              <span class="pill" id="serviceStatus">检测中</span>
            </div>
            <div class="panel-body">
              <div class="status-grid">
                <div class="status-item"><span>模型</span><strong id="modelName">-</strong></div>
                <div class="status-item"><span>RAG</span><strong id="ragMode">-</strong></div>
                <div class="status-item"><span>数据库</span><strong id="databaseBackend">-</strong></div>
                <div class="status-item"><span>Redis</span><strong id="cacheBackend">-</strong></div>
                <div class="status-item"><span>MQ</span><strong id="mqBackend">-</strong></div>
                <div class="status-item"><span>LLM Key</span><strong id="llmKeyState">-</strong></div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">架构链路</div>
            <div class="panel-body architecture" id="architectureList"></div>
          </section>

          <section class="panel">
            <div class="panel-title">测试请求</div>
            <div class="panel-body preset-list">
              <button class="preset" type="button">订单 10002 物流一直不更新怎么办？</button>
              <button class="preset" type="button">订单 10009 我要退款。</button>
              <button class="preset" type="button">订单 10004 直接退款不要审核。</button>
              <button class="preset" type="button">订单 10008 可以开电子发票吗？</button>
              <button class="preset" type="button">我的手表坏了。</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">会话</div>
            <div class="panel-body">
              <div class="data-row"><span>ID</span><strong class="mono" id="conversationId">-</strong></div>
            </div>
          </section>
        </aside>

        <section class="workspace">
          <div class="agent-strip" id="agentStrip"></div>
          <div class="chat-panel">
            <div class="messages" id="messages">
              <div class="empty-state" id="emptyState">
                <h2>多 Agent 售后链路就绪</h2>
                <p>当前控制台只覆盖客服问答、售后处理、风控审核、Hybrid RAG、Redis 状态、MQ 退款任务和可观测评测链路。</p>
              </div>
            </div>
          </div>
        </section>

        <aside class="inspector">
          <section class="panel">
            <div class="panel-title">
              <span>路由判断</span>
              <span class="pill" id="routeIntent">未开始</span>
            </div>
            <div class="panel-body">
              <div class="object-list" id="routeSummary">
                <div class="soft-note">等待请求。</div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <span>Tool Calling</span>
              <span class="pill" id="toolCount">0</span>
            </div>
            <div class="panel-body">
              <div class="tool-list" id="toolList">
                <div class="soft-note">暂无工具调用。</div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">业务对象</div>
            <div class="panel-body">
              <div class="object-list" id="businessObjects">
                <div class="soft-note">暂无业务对象。</div>
              </div>
            </div>
          </section>

          <section class="panel" id="tracePanel">
            <div class="panel-title">响应耗时</div>
            <div class="panel-body">
              <div class="trace" id="timingList">
                <div class="soft-note">暂无耗时数据。</div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">Token 与数据</div>
            <div class="panel-body">
              <div class="object-list" id="metricsList">
                <div class="soft-note">暂无指标。</div>
              </div>
            </div>
          </section>
        </aside>
      </main>

      <form class="input-bar" id="chatForm">
        <textarea id="messageInput" placeholder="输入用户售后问题，例如：订单 10002 物流一直不更新怎么办？"></textarea>
        <button class="btn primary send-btn" id="sendBtn" type="submit">发送</button>
      </form>
    </div>

    <script>
      const state = {
        conversationId: localStorage.getItem("agent_conversation_id") || "",
        route: null,
        tools: [],
        timings: {},
        tokenUsage: null,
        dashboard: {
          refunds: [],
          tickets: [],
          reviews: [],
          mq: [],
          metrics: [],
        },
      };

      const els = {
        serviceStatus: document.querySelector("#serviceStatus"),
        modelName: document.querySelector("#modelName"),
        ragMode: document.querySelector("#ragMode"),
        databaseBackend: document.querySelector("#databaseBackend"),
        cacheBackend: document.querySelector("#cacheBackend"),
        mqBackend: document.querySelector("#mqBackend"),
        llmKeyState: document.querySelector("#llmKeyState"),
        architectureList: document.querySelector("#architectureList"),
        agentStrip: document.querySelector("#agentStrip"),
        messages: document.querySelector("#messages"),
        emptyState: document.querySelector("#emptyState"),
        conversationId: document.querySelector("#conversationId"),
        routeIntent: document.querySelector("#routeIntent"),
        routeSummary: document.querySelector("#routeSummary"),
        toolCount: document.querySelector("#toolCount"),
        toolList: document.querySelector("#toolList"),
        businessObjects: document.querySelector("#businessObjects"),
        timingList: document.querySelector("#timingList"),
        metricsList: document.querySelector("#metricsList"),
        tracePanel: document.querySelector("#tracePanel"),
        chatForm: document.querySelector("#chatForm"),
        messageInput: document.querySelector("#messageInput"),
        sendBtn: document.querySelector("#sendBtn"),
        streamToggle: document.querySelector("#streamToggle"),
        traceToggle: document.querySelector("#traceToggle"),
        llmToggle: document.querySelector("#llmToggle"),
        newChatBtn: document.querySelector("#newChatBtn"),
      };

      const AGENTS = [
        { name: "Orchestrator", role: "路由", tools: "状态管理 / 汇总" },
        { name: "客服 Agent", role: "问答", tools: "Hybrid RAG" },
        { name: "售后 Agent", role: "业务", tools: "订单 / 退款 / 工单" },
        { name: "风控 Agent", role: "审核", tools: "风险规则 / 人工审核" },
      ];

      const ARCHITECTURE = [
        ["FastAPI", "统一 API 与 SSE 流式响应"],
        ["Agent Orchestrator", "请求路由、状态管理、结果汇总"],
        ["客服 Agent", "意图识别、知识库检索、回复生成"],
        ["售后 Agent", "订单查询、退款申请、工单创建"],
        ["风控 Agent", "高频退款、异常账号、投诉升级"],
        ["Hybrid RAG", "向量召回 + BM25/关键词召回 + 业务重排"],
        ["MySQL / SQLite", "订单、退款、工单、会话、执行记录"],
        ["Redis", "会话、Embedding、Agent 状态、退款幂等"],
        ["MQ", "退款任务异步处理"],
      ];

      const TOOL_LABELS = {
        order_lookup: "订单查询",
        policy_search: "知识检索",
        risk_check: "风控检测",
        refund_apply: "退款申请",
        create_manual_review: "人工审核",
        create_ticket: "工单创建",
        transfer_to_human: "转人工",
        ticket_decision: "工单判断",
        tool_plan_validation: "计划校验",
        tool_chain_validation: "链路校验",
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatBool(value) {
        return value ? "是" : "否";
      }

      function setPill(el, text, type = "") {
        el.textContent = text;
        el.className = `pill ${type}`.trim();
      }

      function updateConversationId(id) {
        if (!id) return;
        state.conversationId = id;
        localStorage.setItem("agent_conversation_id", id);
        els.conversationId.textContent = id;
      }

      function renderArchitecture(activeAgents = []) {
        const active = new Set(["FastAPI", "Agent Orchestrator", ...activeAgents]);
        els.architectureList.innerHTML = ARCHITECTURE.map(([name, sub]) => `
          <div class="arch-node ${active.has(name) ? "active" : ""}">
            <span class="arch-dot"></span>
            <div>
              <div class="arch-name">${escapeHtml(name)}</div>
              <div class="arch-sub">${escapeHtml(sub)}</div>
            </div>
          </div>
        `).join("");
      }

      function renderAgents(activeAgents = [], route = null) {
        const active = new Set(["Orchestrator", ...activeAgents]);
        const toolPlan = route?.tool_plan || [];
        els.agentStrip.innerHTML = AGENTS.map((agent) => {
          const tools = agent.name === "Orchestrator" ? toolPlan.join(" / ") || agent.tools : agent.tools;
          return `
            <div class="agent-card ${active.has(agent.name) ? "active" : ""}">
              <div class="agent-role">${escapeHtml(agent.role)}</div>
              <div class="agent-name">${escapeHtml(agent.name)}</div>
              <div class="agent-tools">${escapeHtml(tools)}</div>
            </div>
          `;
        }).join("");
      }

      function resetCurrentRun() {
        state.route = null;
        state.tools = [];
        state.timings = {};
        state.tokenUsage = null;
        setPill(els.routeIntent, "路由中", "warn");
        setPill(els.toolCount, "0");
        els.routeSummary.innerHTML = `<div class="soft-note">等待路由结果。</div>`;
        els.toolList.innerHTML = `<div class="soft-note">暂无工具调用。</div>`;
        els.businessObjects.innerHTML = `<div class="soft-note">暂无业务对象。</div>`;
        els.timingList.innerHTML = `<div class="soft-note">暂无耗时数据。</div>`;
        els.metricsList.innerHTML = `<div class="soft-note">暂无指标。</div>`;
        renderAgents();
        renderArchitecture();
      }

      function addMessage(role, content = "") {
        els.emptyState?.classList.add("hidden");
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;
        wrapper.innerHTML = `
          <div class="speaker">${role === "user" ? "用户" : "Agent"}</div>
          <div class="bubble"></div>
        `;
        const bubble = wrapper.querySelector(".bubble");
        bubble.textContent = content;
        els.messages.appendChild(wrapper);
        els.messages.scrollTop = els.messages.scrollHeight;
        return { wrapper, bubble };
      }

      function addRating(wrapper) {
        const rating = document.createElement("div");
        rating.className = "rating";
        rating.innerHTML = `
          <span>本轮评分</span>
          ${[1, 2, 3, 4, 5].map((score) => `<button type="button" data-score="${score}">${score}</button>`).join("")}
        `;
        rating.addEventListener("click", async (event) => {
          const button = event.target.closest("button[data-score]");
          if (!button || !state.conversationId) return;
          await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversation_id: state.conversationId,
              score: Number(button.dataset.score),
            }),
          });
          rating.innerHTML = `<span>已评分 ${button.dataset.score}</span>`;
        });
        wrapper.appendChild(rating);
      }

      function renderRoute(route) {
        if (!route) return;
        const riskType = route.risk_level === "high" ? "danger" : route.risk_level === "medium" ? "warn" : "ok";
        setPill(els.routeIntent, route.intent || "general_support", riskType);
        const rows = [
          ["订单号", route.order_id || "-"],
          ["置信度", route.confidence ?? "-"],
          ["需订单", formatBool(route.need_order)],
          ["需 RAG", formatBool(route.need_policy)],
          ["需退款", formatBool(route.need_refund_request)],
          ["需风控", formatBool(route.need_risk_check)],
          ["需工单", formatBool(route.need_ticket)],
          ["人工审核", formatBool(route.manual_review_required || route.handoff_required)],
          ["风险等级", route.risk_level || "low"],
        ];
        els.routeSummary.innerHTML = rows.map(([label, value]) => `
          <div class="data-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>
        `).join("");
        renderAgents(route.agent_plan || [], route);
        renderArchitecture(route.agent_plan || []);
      }

      function summarizeTool(tool) {
        const result = tool.result;
        if (tool.tool_name === "order_lookup" && tool.success && result) {
          return `订单 ${result.order_id}，状态：${result.order_status}，物流：${result.shipping_status || "-"}`;
        }
        if (tool.tool_name === "policy_search" && tool.success && Array.isArray(result)) {
          return result.slice(0, 2).map((item) => item.citation || item.source).join("；");
        }
        if (tool.tool_name === "risk_check" && tool.success && result) {
          return `风险等级：${result.risk_level}，原因：${(result.risk_flags || []).join("、") || result.review_reason}`;
        }
        if (tool.tool_name === "refund_apply" && result) {
          return tool.success
            ? `退款单 ${result.refund_id}，状态：${result.status}，MQ：${result.mq_message_id || "-"}`
            : result.reason || JSON.stringify(result);
        }
        if (tool.tool_name === "create_ticket" && tool.success && result) {
          return `工单 ${result.ticket_id}，类型：${result.issue_type}，状态：${result.status}`;
        }
        if (tool.tool_name === "create_manual_review" && tool.success && result) {
          return `审核单 ${result.review_id}，风险：${result.risk_level}，状态：${result.status}`;
        }
        if (tool.tool_name === "transfer_to_human" && tool.success && result) {
          return result.handoff_summary || result.reason;
        }
        if (tool.tool_name === "ticket_decision" && result) {
          return result.reason || JSON.stringify(result);
        }
        return typeof result === "string" ? result : JSON.stringify(result);
      }

      function renderTools() {
        setPill(els.toolCount, String(state.tools.length), state.tools.some((item) => !item.success) ? "warn" : "ok");
        if (!state.tools.length) {
          els.toolList.innerHTML = `<div class="soft-note">暂无工具调用。</div>`;
          return;
        }
        els.toolList.innerHTML = state.tools.map((tool) => `
          <div class="tool-item">
            <div class="tool-head">
              <span class="tool-name">${escapeHtml(TOOL_LABELS[tool.tool_name] || tool.tool_name)}</span>
              <span class="pill ${tool.success ? "ok" : "danger"}">${tool.success ? "成功" : "失败"}</span>
            </div>
            <div class="tool-summary">${escapeHtml(summarizeTool(tool))}</div>
          </div>
        `).join("");
      }

      function latestTool(name) {
        return [...state.tools].reverse().find((item) => item.tool_name === name && item.success);
      }

      function renderBusinessObjects() {
        const rows = [];
        const order = latestTool("order_lookup")?.result;
        const refund = latestTool("refund_apply")?.result;
        const ticket = latestTool("create_ticket")?.result;
        const review = latestTool("create_manual_review")?.result;

        if (order) {
          rows.push(["订单", `${order.order_id} · ${order.order_status}`]);
        }
        if (refund) {
          rows.push(["退款", `${refund.refund_id} · ${refund.status}`]);
          rows.push(["MQ", refund.mq_message_id || "-"]);
        }
        if (ticket) {
          rows.push(["工单", `${ticket.ticket_id} · ${ticket.issue_type}`]);
        }
        if (review) {
          rows.push(["审核", `${review.review_id} · ${review.risk_level}`]);
        }

        if (!rows.length) {
          els.businessObjects.innerHTML = `<div class="soft-note">暂无业务对象。</div>`;
          return;
        }

        els.businessObjects.innerHTML = rows.map(([label, value]) => `
          <div class="data-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>
        `).join("");
      }

      function renderTimings() {
        const items = Object.values(state.timings);
        if (!items.length) {
          els.timingList.innerHTML = `<div class="soft-note">暂无耗时数据。</div>`;
          return;
        }
        const max = Math.max(...items.map((item) => Number(item.duration_ms || 0)), 1);
        els.timingList.innerHTML = items.map((item) => {
          const width = Math.max(4, Math.min(100, Number(item.duration_ms || 0) / max * 100));
          const label = String(item.step || "").replace("node.", "").replace("tool.", "");
          return `
            <div class="trace-item">
              <span class="trace-step">${escapeHtml(label)}</span>
              <div title="${escapeHtml(item.duration_ms)} ms">
                <div class="trace-value"><div class="trace-bar" style="width:${width}%"></div></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderMetrics(doneContent = null) {
        if (doneContent?.token_usage) {
          state.tokenUsage = doneContent.token_usage;
        }
        const token = state.tokenUsage || {};
        const latestMetric = state.dashboard.metrics[0] || {};
        const rows = [
          ["Prompt", token.prompt_tokens_estimated ?? "-"],
          ["Completion", token.completion_tokens_estimated ?? "-"],
          ["Total", token.total_tokens_estimated ?? "-"],
          ["本轮耗时", doneContent?.duration_ms ? `${doneContent.duration_ms}ms` : latestMetric.duration_ms ? `${latestMetric.duration_ms}ms` : "-"],
          ["退款记录", state.dashboard.refunds.length],
          ["MQ 消息", state.dashboard.mq.length],
          ["人工审核", state.dashboard.reviews.length],
        ];
        els.metricsList.innerHTML = rows.map(([label, value]) => `
          <div class="metric-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>
        `).join("");
      }

      function handleEvent(event, assistantBubble) {
        if (!event || event.type === "status") return;
        if (event.conversation_id) updateConversationId(event.conversation_id);

        if (event.type === "route") {
          state.route = event.content;
          renderRoute(state.route);
          return;
        }

        if (event.type === "tool_result") {
          state.tools.push(event.content);
          renderTools();
          renderBusinessObjects();
          return;
        }

        if (event.type === "timing") {
          state.timings[event.content.step] = event.content;
          renderTimings();
          return;
        }

        if (event.type === "token") {
          assistantBubble.textContent += event.content;
          els.messages.scrollTop = els.messages.scrollHeight;
          return;
        }

        if (event.type === "message") {
          assistantBubble.textContent = event.content;
          els.messages.scrollTop = els.messages.scrollHeight;
          return;
        }

        if (event.type === "done") {
          if (event.content?.reply) {
            assistantBubble.textContent = event.content.reply;
          }
          if (event.content?.route) {
            state.route = event.content.route;
            renderRoute(state.route);
          }
          if (Array.isArray(event.content?.tool_results)) {
            state.tools = event.content.tool_results;
            renderTools();
            renderBusinessObjects();
          }
          if (event.content?.timings) {
            state.timings = event.content.timings;
            renderTimings();
          }
          renderMetrics(event.content);
          refreshDashboard();
        }

        if (event.type === "error") {
          assistantBubble.textContent = `请求失败：${event.content}`;
          setPill(els.routeIntent, "错误", "danger");
        }
      }

      async function sendByStream(message, assistantBubble) {
        const response = await fetch("/agent/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            conversation_id: state.conversationId || null,
            use_llm: els.llmToggle.checked,
            stream_tokens: true,
          }),
        });

        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const chunk of chunks) {
            const line = chunk.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;
            const raw = line.slice(6);
            if (raw === "[DONE]") continue;
            handleEvent(JSON.parse(raw), assistantBubble);
          }
        }
      }

      async function sendByJson(message, assistantBubble) {
        const response = await fetch("/agent/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            conversation_id: state.conversationId || null,
            use_llm: els.llmToggle.checked,
          }),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || `HTTP ${response.status}`);
        }
        handleEvent({ type: "done", content: result, conversation_id: result.conversation_id }, assistantBubble);
      }

      async function submitMessage(message) {
        const text = message.trim();
        if (!text) return;
        resetCurrentRun();
        addMessage("user", text);
        const assistant = addMessage("agent", "正在处理...");
        els.messageInput.value = "";
        els.sendBtn.disabled = true;

        try {
          if (els.streamToggle.checked) {
            await sendByStream(text, assistant.bubble);
          } else {
            await sendByJson(text, assistant.bubble);
          }
          addRating(assistant.wrapper);
        } catch (error) {
          assistant.bubble.textContent = `请求失败：${error.message}`;
          setPill(els.routeIntent, "错误", "danger");
        } finally {
          els.sendBtn.disabled = false;
          els.messageInput.focus();
        }
      }

      async function loadServiceInfo() {
        try {
          const [infoResponse, healthResponse] = await Promise.all([
            fetch("/info"),
            fetch("/health"),
          ]);
          const info = await infoResponse.json();
          const health = await healthResponse.json();
          els.modelName.textContent = info.default_model || "-";
          els.ragMode.textContent = health.rag_retrieval_mode || info.rag_embedding_provider || "-";
          els.databaseBackend.textContent = health.database_backend || "-";
          els.cacheBackend.textContent = health.cache?.backend || (health.redis_enabled ? "redis" : "local");
          els.mqBackend.textContent = health.mq_backend || "-";
          els.llmKeyState.textContent = info.has_llm_key ? "已配置" : "本地回复";
          setPill(els.serviceStatus, health.success ? "在线" : "异常", health.success ? "ok" : "danger");
        } catch (error) {
          setPill(els.serviceStatus, "离线", "danger");
        }
      }

      async function refreshDashboard() {
        try {
          const [refunds, tickets, reviews, mq, metrics] = await Promise.all([
            fetch("/refunds?limit=20").then((res) => res.json()),
            fetch("/tickets?limit=20").then((res) => res.json()),
            fetch("/manual-reviews?limit=20").then((res) => res.json()),
            fetch("/mq/messages?limit=20").then((res) => res.json()),
            fetch("/observability/metrics?limit=20").then((res) => res.json()),
          ]);
          state.dashboard = {
            refunds: refunds.data || [],
            tickets: tickets.data || [],
            reviews: reviews.data || [],
            mq: mq.data || [],
            metrics: metrics.data || [],
          };
          renderMetrics();
        } catch (error) {
          els.metricsList.innerHTML = `<div class="soft-note">指标读取失败。</div>`;
        }
      }

      els.chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitMessage(els.messageInput.value);
      });

      els.messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          submitMessage(els.messageInput.value);
        }
      });

      document.querySelectorAll(".preset").forEach((button) => {
        button.addEventListener("click", () => {
          els.messageInput.value = button.textContent.trim();
          submitMessage(els.messageInput.value);
        });
      });

      els.traceToggle.addEventListener("change", () => {
        els.tracePanel.classList.toggle("hidden", !els.traceToggle.checked);
      });

      els.newChatBtn.addEventListener("click", () => {
        state.conversationId = "";
        localStorage.removeItem("agent_conversation_id");
        els.conversationId.textContent = "-";
        els.messages.innerHTML = `
          <div class="empty-state" id="emptyState">
            <h2>多 Agent 售后链路就绪</h2>
            <p>当前控制台只覆盖客服问答、售后处理、风控审核、Hybrid RAG、Redis 状态、MQ 退款任务和可观测评测链路。</p>
          </div>
        `;
        els.emptyState = document.querySelector("#emptyState");
        resetCurrentRun();
      });

      renderArchitecture();
      renderAgents();
      if (state.conversationId) {
        els.conversationId.textContent = state.conversationId;
      }
      loadServiceInfo();
      refreshDashboard();
    </script>
  </body>
</html>
